layout: null
permalink: /
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Privacy Policy for the Frames wallpaper app.">
  <meta name="theme-color" content="#f4f7f8">
  <title>Privacy Policy | Frames</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f7f8;
      --paper: #ffffff;
      --ink: #182329;
      --muted: #53666e;
      --accent: #236a75;
      --line: #dce5e8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 48px 20px;
      background: radial-gradient(ellipse at 50% 0%, #e2eef0 0, var(--page) 48rem);
      color: var(--ink);
      font: 16px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 820px);
      margin: 0 auto;
      padding: clamp(28px, 6vw, 64px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: 0 20px 60px rgb(26 55 63 / 8%);
    }

    h1, h2 { line-height: 1.25; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -0.04em; }
    h2 { margin: 40px 0 12px; font-size: 1.25rem; letter-spacing: -0.015em; }
    p { margin: 12px 0; }
    ul { padding-left: 1.4rem; }
    li { padding-left: 0.2rem; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid #74aeb7; outline-offset: 3px; border-radius: 2px; }
    code { overflow-wrap: anywhere; }
    h1 + p { margin-top: 12px; color: var(--muted); font-size: 0.94rem; }

    @media (max-width: 560px) {
      body { padding: 16px 12px; }
      main { padding: 28px 22px; border-radius: 18px; }
      h2 { margin-top: 32px; }
    }
  </style>
</head>
<body>
  <main>
    <article>
      {% capture policy_markdown %}{% include_relative PRIVACY.md %}{% endcapture %}
      {{ policy_markdown | markdownify }}
    </article>
  </main>
</body>
</html>
